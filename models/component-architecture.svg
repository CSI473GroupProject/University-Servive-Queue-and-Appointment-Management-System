<svg viewBox="0 0 1000 900" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
  </defs>

  <text x="500" y="24" text-anchor="middle" font-size="16" font-weight="bold" fill="#7a1f2b">Student Registration Queue Management System — Team 17</text>
  <text x="500" y="42" text-anchor="middle" font-size="12" fill="#555">Component/module view — CSI473 Lab 07 (readable export of component-architecture.mmd)</text>

  <!-- System boundary -->
  <rect x="30" y="60" width="760" height="760" rx="6" fill="#f7f7f9" stroke="#7a1f2b" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="46" y="80" font-size="12" font-weight="bold" fill="#7a1f2b">System boundary — Layered Monolith (ADR-001)</text>

  <!-- Presentation layer -->
  <rect x="55" y="95" width="710" height="90" fill="#ffffff" stroke="#333"/>
  <text x="65" y="110" font-size="11" font-weight="bold">Presentation layer</text>
  <rect x="65" y="118" width="215" height="58" fill="#eaf2ff" stroke="#333"/>
  <text x="172" y="138" text-anchor="middle" font-size="10" font-weight="bold">Student Web/Mobile Interface</text>
  <text x="172" y="152" text-anchor="middle" font-size="9">UC-01,02,04-08,10</text>
  <text x="172" y="164" text-anchor="middle" font-size="9">FR-01 to FR-08</text>

  <rect x="295" y="118" width="215" height="58" fill="#eaf2ff" stroke="#333"/>
  <text x="402" y="138" text-anchor="middle" font-size="10" font-weight="bold">Registration Staff Dashboard</text>
  <text x="402" y="152" text-anchor="middle" font-size="9">UC-12 to UC-15</text>
  <text x="402" y="164" text-anchor="middle" font-size="9">FR-09, FR-10</text>

  <rect x="525" y="118" width="215" height="58" fill="#eaf2ff" stroke="#333"/>
  <text x="632" y="138" text-anchor="middle" font-size="10" font-weight="bold">Administrator Console</text>
  <text x="632" y="152" text-anchor="middle" font-size="9">UC-16 to UC-18</text>

  <!-- Auth cross-cutting -->
  <rect x="800" y="95" width="185" height="350" fill="#fdecea" stroke="#7a1f2b"/>
  <text x="892" y="112" text-anchor="middle" font-size="10" font-weight="bold">Authentication &amp;</text>
  <text x="892" y="125" text-anchor="middle" font-size="10" font-weight="bold">Access Control</text>
  <text x="892" y="140" text-anchor="middle" font-size="9">(cross-cutting)</text>
  <text x="892" y="155" text-anchor="middle" font-size="9">QS-03 / AD-03</text>
  <text x="892" y="172" text-anchor="middle" font-size="9">enforces Student / Staff /</text>
  <text x="892" y="184" text-anchor="middle" font-size="9">Administrator roles before</text>
  <text x="892" y="196" text-anchor="middle" font-size="9">requests reach services</text>

  <!-- arrows presentation -> auth -->
  <line x1="800" y1="140" x2="785" y2="140" stroke="#7a1f2b" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="3 2"/>

  <!-- Application/service layer -->
  <rect x="55" y="205" width="710" height="150" fill="#ffffff" stroke="#333"/>
  <text x="65" y="220" font-size="11" font-weight="bold">Application / service layer</text>

  <rect x="65" y="228" width="130" height="55" fill="#eafbea" stroke="#333"/>
  <text x="130" y="248" text-anchor="middle" font-size="9" font-weight="bold">Queue Service</text>
  <text x="130" y="260" text-anchor="middle" font-size="8">UC-02 to UC-05</text>
  <text x="130" y="271" text-anchor="middle" font-size="8">FR-02 to FR-04</text>

  <rect x="205" y="228" width="130" height="55" fill="#eafbea" stroke="#333"/>
  <text x="270" y="248" text-anchor="middle" font-size="9" font-weight="bold">Appointment Service</text>
  <text x="270" y="260" text-anchor="middle" font-size="8">UC-06 to UC-09</text>
  <text x="270" y="271" text-anchor="middle" font-size="8">FR-05 to FR-08</text>

  <rect x="345" y="228" width="130" height="55" fill="#eafbea" stroke="#333"/>
  <text x="410" y="252" text-anchor="middle" font-size="9" font-weight="bold">Notification Service</text>
  <text x="410" y="264" text-anchor="middle" font-size="8">UC-11</text>

  <rect x="485" y="228" width="130" height="55" fill="#eafbea" stroke="#333"/>
  <text x="550" y="248" text-anchor="middle" font-size="9" font-weight="bold">Staff Operations Svc</text>
  <text x="550" y="260" text-anchor="middle" font-size="8">UC-12 to UC-15</text>
  <text x="550" y="271" text-anchor="middle" font-size="8">FR-09, FR-10</text>

  <rect x="625" y="228" width="130" height="55" fill="#eafbea" stroke="#333"/>
  <text x="690" y="252" text-anchor="middle" font-size="9" font-weight="bold">Administration Svc</text>
  <text x="690" y="264" text-anchor="middle" font-size="8">UC-16 to UC-18</text>

  <!-- arrows presentation -> app -->
  <line x1="172" y1="176" x2="130" y2="228" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="172" y1="176" x2="270" y2="228" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="402" y1="176" x2="550" y2="228" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="632" y1="176" x2="690" y2="228" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="550" y1="283" x2="130" y2="283" stroke="#333" stroke-width="1" stroke-dasharray="2 2" marker-end="url(#arrow)"/>
  <text x="330" y="297" text-anchor="middle" font-size="8" fill="#555">Staff Ops Svc calls Queue Svc / Appointment Svc (UC-14, UC-15)</text>

  <!-- Domain layer -->
  <rect x="55" y="365" width="710" height="70" fill="#ffffff" stroke="#333"/>
  <text x="65" y="380" font-size="11" font-weight="bold">Domain layer</text>
  <rect x="65" y="386" width="690" height="42" fill="#fff6e8" stroke="#333"/>
  <text x="410" y="402" text-anchor="middle" font-size="9">Student, RegistrationStaff, Administrator, RegistrationService, QueueEntry, Appointment, Slot, Notification</text>
  <text x="410" y="416" text-anchor="middle" font-size="8" fill="#555">Shared status values: Waiting / Called / Served / No-show / Cancelled (state models, Phase 1 §7.2)</text>

  <line x1="130" y1="283" x2="200" y2="386" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="270" y1="283" x2="350" y2="386" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="410" y1="283" x2="450" y2="386" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="690" y1="283" x2="600" y2="386" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Data access layer -->
  <rect x="55" y="455" width="710" height="80" fill="#ffffff" stroke="#333"/>
  <text x="65" y="470" font-size="11" font-weight="bold">Data access layer</text>
  <rect x="65" y="478" width="160" height="45" fill="#f0eaff" stroke="#333"/>
  <text x="145" y="504" text-anchor="middle" font-size="9">QueueRepository</text>
  <rect x="240" y="478" width="160" height="45" fill="#f0eaff" stroke="#333"/>
  <text x="320" y="504" text-anchor="middle" font-size="9">AppointmentRepository</text>
  <rect x="415" y="478" width="160" height="45" fill="#f0eaff" stroke="#333"/>
  <text x="495" y="504" text-anchor="middle" font-size="9">ServiceRepository</text>
  <rect x="590" y="478" width="160" height="45" fill="#f0eaff" stroke="#333"/>
  <text x="670" y="504" text-anchor="middle" font-size="9">UserRepository</text>

  <line x1="410" y1="428" x2="145" y2="478" stroke="#333" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="410" y1="428" x2="320" y2="478" stroke="#333" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="410" y1="428" x2="495" y2="478" stroke="#333" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="892" y1="445" x2="670" y2="478" stroke="#7a1f2b" stroke-width="1" stroke-dasharray="3 2" marker-end="url(#arrow)"/>

  <!-- Database (data boundary) -->
  <g>
    <path d="M330,565 a90,14 0 1,0 180.1,0 a90,14 0 1,0 -180.1,0 l0,55 a90,14 0 0,0 180.1,0 z" fill="#eef3ff" stroke="#333" stroke-width="1.5"/>
    <text x="420" y="595" text-anchor="middle" font-size="10" font-weight="bold">Relational Database</text>
    <text x="420" y="608" text-anchor="middle" font-size="8">single datastore — AD-02</text>
  </g>
  <line x1="145" y1="523" x2="360" y2="566" stroke="#333" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="320" y1="523" x2="400" y2="566" stroke="#333" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="495" y1="523" x2="440" y2="566" stroke="#333" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="670" y1="523" x2="480" y2="566" stroke="#333" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Failure/data boundary note -->
  <rect x="55" y="650" width="710" height="60" fill="#fff9f0" stroke="#c99" stroke-dasharray="4 3"/>
  <text x="65" y="666" font-size="9" font-weight="bold" fill="#7a1f2b">Data / failure boundary note</text>
  <text x="65" y="680" font-size="8.5" fill="#555">All queue and appointment state changes (UC-02, UC-06, UC-14, UC-15) commit within one database transaction —</text>
  <text x="65" y="692" font-size="8.5" fill="#555">no distributed-transaction risk (satisfies AD-02 / QS-04). Reporting queries (UC-18) are the one workload flagged</text>
  <text x="65" y="704" font-size="8.5" fill="#555">for isolation if load testing shows contention with queue operations (see ADR-001 reconsideration trigger).</text>

  <!-- External system: Notification Gateway -->
  <rect x="810" y="600" width="175" height="110" fill="#fff3f3" stroke="#999" stroke-dasharray="5 3"/>
  <text x="897" y="618" text-anchor="middle" font-size="10" font-weight="bold">External:</text>
  <text x="897" y="631" text-anchor="middle" font-size="10" font-weight="bold">Notification Gateway</text>
  <text x="897" y="646" text-anchor="middle" font-size="8.5">(SMS / Email provider)</text>
  <text x="897" y="665" text-anchor="middle" font-size="8" fill="#555">Isolated failure domain —</text>
  <text x="897" y="677" text-anchor="middle" font-size="8" fill="#555">a gateway outage cannot</text>
  <text x="897" y="689" text-anchor="middle" font-size="8" fill="#555">block queue/appointment</text>
  <text x="897" y="701" text-anchor="middle" font-size="8" fill="#555">processing (UC-11 fallback)</text>

  <line x1="410" y1="283" x2="897" y2="600" stroke="#7a1f2b" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="700" y="440" font-size="8" fill="#7a1f2b" transform="rotate(28 700 440)">async, outside trust boundary</text>

  <!-- Legend -->
  <rect x="30" y="740" width="760" height="70" fill="#ffffff" stroke="#333"/>
  <text x="40" y="756" font-size="10" font-weight="bold">Legend</text>
  <line x1="40" y1="768" x2="70" y2="768" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="76" y="772" font-size="8.5">Dependency direction (caller → callee)</text>
  <line x1="290" y1="768" x2="320" y2="768" stroke="#7a1f2b" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="326" y="772" font-size="8.5">Crosses system/security/trust boundary</text>
  <rect x="40" y="782" width="14" height="10" fill="#fdecea" stroke="#7a1f2b"/>
  <text x="60" y="791" font-size="8.5">Security-enforcing component</text>
  <rect x="290" y="782" width="14" height="10" fill="#eef3ff" stroke="#333"/>
  <text x="310" y="791" font-size="8.5">Data store</text>
  <rect x="450" y="782" width="14" height="10" fill="#fff3f3" stroke="#999" stroke-dasharray="3 2"/>
  <text x="470" y="791" font-size="8.5">External system (outside system boundary)</text>
</svg>
