<svg viewBox="0 0 1000 760" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
  </defs>

  <text x="500" y="24" text-anchor="middle" font-size="16" font-weight="bold" fill="#7a1f2b">Deployment Diagram — Student Registration Queue Management System</text>
  <text x="500" y="42" text-anchor="middle" font-size="11" fill="#555">Realises the layered monolith selected in ADR-001 (Lab 07) — readable export of deployment.mmd</text>

  <!-- Client zone -->
  <rect x="30" y="65" width="940" height="110" fill="#fff3f3" stroke="#999" stroke-dasharray="4 3"/>
  <text x="45" y="83" font-size="11" font-weight="bold" fill="#7a1f2b">Client devices — untrusted network zone</text>
  <rect x="60" y="95" width="260" height="65" fill="#ffffff" stroke="#333"/>
  <text x="190" y="118" text-anchor="middle" font-size="10" font-weight="bold">Student browser / mobile</text>
  <text x="190" y="133" text-anchor="middle" font-size="9">Student Web/Mobile Interface</text>
  <text x="190" y="146" text-anchor="middle" font-size="8.5" fill="#555">UC-01,02,06-08,10</text>

  <rect x="365" y="95" width="260" height="65" fill="#ffffff" stroke="#333"/>
  <text x="495" y="118" text-anchor="middle" font-size="10" font-weight="bold">Staff counter workstation</text>
  <text x="495" y="133" text-anchor="middle" font-size="9">Registration Staff Dashboard</text>
  <text x="495" y="146" text-anchor="middle" font-size="8.5" fill="#555">UC-12 to UC-15</text>

  <rect x="670" y="95" width="260" height="65" fill="#ffffff" stroke="#333"/>
  <text x="800" y="118" text-anchor="middle" font-size="10" font-weight="bold">Admin workstation</text>
  <text x="800" y="133" text-anchor="middle" font-size="9">Administrator Console</text>
  <text x="800" y="146" text-anchor="middle" font-size="8.5" fill="#555">UC-16 to UC-18</text>

  <!-- TLS boundary -->
  <rect x="300" y="195" width="400" height="55" fill="#fff8e8" stroke="#a67a1f" stroke-width="1.5"/>
  <text x="500" y="212" text-anchor="middle" font-size="10" font-weight="bold" fill="#a67a1f">TLS boundary — public internet / campus network</text>
  <text x="500" y="232" text-anchor="middle" font-size="9">Load balancer / reverse proxy (TLS termination)</text>

  <line x1="190" y1="160" x2="440" y2="195" stroke="#333" stroke-width="1.3" marker-end="url(#arr)"/>
  <line x1="495" y1="160" x2="500" y2="195" stroke="#333" stroke-width="1.3" marker-end="url(#arr)"/>
  <line x1="800" y1="160" x2="560" y2="195" stroke="#333" stroke-width="1.3" marker-end="url(#arr)"/>
  <text x="320" y="185" font-size="8" fill="#555">HTTPS</text>

  <!-- Application node -->
  <rect x="150" y="280" width="700" height="150" fill="#eaf6ea" stroke="#2c6a2c" stroke-width="2"/>
  <text x="165" y="300" font-size="11" font-weight="bold" fill="#2c6a2c">Application node — university-hosted, trusted zone</text>
  <rect x="175" y="312" width="500" height="100" fill="#ffffff" stroke="#333"/>
  <text x="425" y="332" text-anchor="middle" font-size="10" font-weight="bold">Monolithic application server</text>
  <text x="425" y="348" text-anchor="middle" font-size="9">Presentation + Application/service +</text>
  <text x="425" y="361" text-anchor="middle" font-size="9">Domain + Data access layers (ADR-001)</text>
  <text x="425" y="378" text-anchor="middle" font-size="8.5" fill="#555">Queue Svc, Appointment Svc, Notification Svc,</text>
  <text x="425" y="390" text-anchor="middle" font-size="8.5" fill="#555">Staff Ops Svc, Administration Svc</text>

  <rect x="695" y="312" width="130" height="100" fill="#fdecea" stroke="#7a1f2b"/>
  <text x="760" y="334" text-anchor="middle" font-size="9" font-weight="bold">Authentication</text>
  <text x="760" y="347" text-anchor="middle" font-size="9" font-weight="bold">&amp; Access Control</text>
  <text x="760" y="365" text-anchor="middle" font-size="8">QS-03 / AD-03</text>

  <line x1="500" y1="250" x2="500" y2="312" stroke="#333" stroke-width="1.3" marker-end="url(#arr)"/>
  <text x="510" y="270" font-size="8" fill="#555">HTTPS, internal</text>
  <line x1="675" y1="360" x2="695" y2="360" stroke="#7a1f2b" stroke-width="1.3" marker-end="url(#arr)"/>

  <!-- Data zone -->
  <rect x="150" y="470" width="320" height="110" fill="#eaf2ff" stroke="#2c4a7a" stroke-width="2"/>
  <text x="165" y="490" font-size="11" font-weight="bold" fill="#2c4a7a">Data zone — trusted, restricted network</text>
  <path d="M250,520 a80,12 0 1,0 160.1,0 a80,12 0 1,0 -160.1,0 l0,40 a80,12 0 0,0 160.1,0 z" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <text x="330" y="545" text-anchor="middle" font-size="10" font-weight="bold">Relational Database</text>
  <text x="330" y="558" text-anchor="middle" font-size="8.5">single datastore — AD-02, QS-04</text>

  <line x1="425" y1="412" x2="330" y2="470" stroke="#333" stroke-width="1.3" marker-end="url(#arr)"/>
  <text x="350" y="445" font-size="8" fill="#555">DB driver, internal-only</text>

  <!-- External zone -->
  <rect x="650" y="470" width="300" height="130" fill="#fff3f3" stroke="#999" stroke-dasharray="4 3"/>
  <text x="665" y="490" font-size="11" font-weight="bold" fill="#7a1f2b">External zone — outside university trust boundary</text>
  <rect x="680" y="505" width="240" height="75" fill="#ffffff" stroke="#333"/>
  <text x="800" y="528" text-anchor="middle" font-size="10" font-weight="bold">Notification Gateway</text>
  <text x="800" y="542" text-anchor="middle" font-size="9">(SMS / Email provider)</text>
  <text x="800" y="557" text-anchor="middle" font-size="8.5" fill="#555">isolated failure domain — UC-11</text>
  <text x="800" y="570" text-anchor="middle" font-size="8.5" fill="#555">fallback (ADR-004)</text>

  <line x1="675" y1="412" x2="800" y2="505" stroke="#7a1f2b" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arr)"/>
  <text x="700" y="460" font-size="8" fill="#7a1f2b">HTTPS, async, outbound only</text>

  <!-- Legend -->
  <rect x="30" y="630" width="940" height="110" fill="#ffffff" stroke="#333"/>
  <text x="40" y="648" font-size="10" font-weight="bold">Trust / network boundary notes</text>
  <text x="40" y="664" font-size="9" fill="#555">• TLS boundary: all client traffic is encrypted and terminated at the load balancer before reaching the application node.</text>
  <text x="40" y="678" font-size="9" fill="#555">• Application ↔ Database traffic stays on an internal network segment only — the database is never directly reachable from client devices.</text>
  <text x="40" y="692" font-size="9" fill="#555">• The Notification Gateway sits outside the university trust boundary; the connection is outbound-only and asynchronous, so a gateway</text>
  <text x="40" y="704" font-size="9" fill="#555">  outage cannot block or corrupt queue/appointment processing inside the application node (supports the failure-recovery design in</text>
  <text x="40" y="716" font-size="9" fill="#555">  models/failure-recovery.mmd).</text>
  <text x="40" y="730" font-size="9" fill="#555">• Single application node and single database reflect ADR-001's accepted scope (one university's registration periods, not multi-tenant scale).</text>
</svg>
