<svg viewBox="0 0 1040 780" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
    <marker id="ared" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#b23b3b"/>
    </marker>
  </defs>

  <text x="520" y="22" text-anchor="middle" font-size="16" font-weight="bold" fill="#7a1f2b">Failure/Recovery Flow — Concurrent Appointment Slot Booking</text>
  <text x="520" y="40" text-anchor="middle" font-size="11" fill="#555">UC-06 exception 4a, ADR-003 optimistic concurrency — readable export of failure-recovery.mmd</text>

  <!-- Lifelines -->
  <g font-size="10" font-weight="bold" text-anchor="middle">
    <text x="70" y="65">Student A</text>
    <text x="220" y="65">Student B</text>
    <text x="400" y="65">AppointmentController</text>
    <text x="580" y="65">AppointmentService</text>
    <text x="760" y="65">AppointmentRepository</text>
    <text x="960" y="65">Database</text>
  </g>
  <g stroke="#999" stroke-width="1">
    <line x1="70" y1="72" x2="70" y2="740"/>
    <line x1="220" y1="72" x2="220" y2="740"/>
    <line x1="400" y1="72" x2="400" y2="740"/>
    <line x1="580" y1="72" x2="580" y2="740"/>
    <line x1="760" y1="72" x2="760" y2="740"/>
    <line x1="960" y1="72" x2="960" y2="740"/>
  </g>

  <!-- Both requests arrive -->
  <line x1="70" y1="90" x2="398" y2="90" stroke="#333" marker-end="url(#a)"/>
  <text x="235" y="86" text-anchor="middle" font-size="8.5">bookAppointment(S1)</text>
  <line x1="220" y1="104" x2="398" y2="104" stroke="#333" marker-end="url(#a)"/>
  <text x="310" y="100" text-anchor="middle" font-size="8.5">bookAppointment(S1)</text>
  <rect x="55" y="112" width="760" height="20" fill="#fff8e8" stroke="#a67a1f" stroke-dasharray="3 2"/>
  <text x="435" y="126" text-anchor="middle" font-size="8.5" fill="#a67a1f">Both requests arrive within milliseconds of each other</text>

  <!-- Student A success path -->
  <line x1="400" y1="150" x2="578" y2="150" stroke="#333" marker-end="url(#a)"/>
  <text x="490" y="146" text-anchor="middle" font-size="8">reserveSlot(A, S1)</text>
  <line x1="580" y1="164" x2="758" y2="164" stroke="#333" marker-end="url(#a)"/>
  <text x="670" y="160" text-anchor="middle" font-size="8">isSlotOpen(S1)</text>
  <line x1="758" y1="178" x2="582" y2="178" stroke="#666" stroke-dasharray="3 2" marker-end="url(#a)"/>
  <text x="670" y="174" text-anchor="middle" font-size="8">true (last known state)</text>

  <line x1="580" y1="194" x2="758" y2="194" stroke="#333" marker-end="url(#a)"/>
  <text x="665" y="190" text-anchor="middle" font-size="8">createAppointment(A, S1, Booked)</text>
  <line x1="760" y1="208" x2="958" y2="208" stroke="#333" marker-end="url(#a)"/>
  <text x="858" y="204" text-anchor="middle" font-size="8">INSERT (UNIQUE slot_id)</text>
  <line x1="958" y1="222" x2="762" y2="222" stroke="#2c6a2c" stroke-dasharray="3 2" marker-end="url(#a)"/>
  <text x="858" y="218" text-anchor="middle" font-size="8" fill="#2c6a2c">201 Created — commit OK</text>
  <line x1="758" y1="236" x2="582" y2="236" stroke="#666" stroke-dasharray="3 2" marker-end="url(#a)"/>
  <text x="670" y="232" text-anchor="middle" font-size="8">appointment record (A)</text>

  <line x1="580" y1="250" x2="760" y2="250" stroke="#333" marker-end="url(#a)"/>
  <text x="620" y="265" font-size="8">sendBookingConfirmation(A)</text>
  <text x="400" y="280" font-size="8" fill="#555">(NotificationService — not shown on lifeline above for brevity)</text>
  <line x1="580" y1="292" x2="402" y2="292" stroke="#666" stroke-dasharray="3 2" marker-end="url(#a)"/>
  <text x="490" y="288" text-anchor="middle" font-size="8">success</text>
  <line x1="400" y1="306" x2="72" y2="306" stroke="#2c6a2c" stroke-dasharray="3 2" marker-end="url(#a)"/>
  <text x="235" y="302" text-anchor="middle" font-size="8.5" fill="#2c6a2c">201 Booked (confirmation)</text>

  <!-- Student B failure path -->
  <rect x="55" y="330" width="960" height="20" fill="#fdecea" stroke="#b23b3b"/>
  <text x="535" y="344" text-anchor="middle" font-size="9" font-weight="bold" fill="#b23b3b">Student B's request — processed moments after A's commit</text>

  <line x1="400" y1="366" x2="578" y2="366" stroke="#333" marker-end="url(#a)"/>
  <text x="490" y="362" text-anchor="middle" font-size="8">reserveSlot(B, S1)</text>
  <line x1="580" y1="380" x2="758" y2="380" stroke="#333" marker-end="url(#a)"/>
  <text x="670" y="376" text-anchor="middle" font-size="8">isSlotOpen(S1)</text>
  <line x1="758" y1="394" x2="582" y2="394" stroke="#666" stroke-dasharray="3 2" marker-end="url(#a)"/>
  <text x="670" y="390" text-anchor="middle" font-size="8">true (stale read — A's commit not yet visible)</text>

  <line x1="580" y1="410" x2="758" y2="410" stroke="#333" marker-end="url(#a)"/>
  <text x="665" y="406" text-anchor="middle" font-size="8">createAppointment(B, S1, Booked)</text>
  <line x1="760" y1="424" x2="958" y2="424" stroke="#333" marker-end="url(#a)"/>
  <text x="858" y="420" text-anchor="middle" font-size="8">INSERT (UNIQUE slot_id)</text>
  <line x1="958" y1="438" x2="762" y2="438" stroke="#b23b3b" stroke-dasharray="3 2" marker-end="url(#ared)"/>
  <text x="858" y="434" text-anchor="middle" font-size="8" fill="#b23b3b">constraint violation — slot already taken</text>
  <line x1="758" y1="452" x2="582" y2="452" stroke="#b23b3b" stroke-dasharray="3 2" marker-end="url(#ared)"/>
  <text x="670" y="448" text-anchor="middle" font-size="8" fill="#b23b3b">SLOT_ALREADY_BOOKED</text>
  <line x1="580" y1="466" x2="402" y2="466" stroke="#b23b3b" stroke-dasharray="3 2" marker-end="url(#ared)"/>
  <text x="490" y="462" text-anchor="middle" font-size="8" fill="#b23b3b">error: SLOT_ALREADY_BOOKED</text>
  <line x1="400" y1="480" x2="222" y2="480" stroke="#b23b3b" stroke-dasharray="3 2" marker-end="url(#ared)"/>
  <text x="310" y="476" text-anchor="middle" font-size="8.5" fill="#b23b3b">409 SLOT_ALREADY_BOOKED</text>

  <!-- Integrity + recovery notes -->
  <rect x="55" y="505" width="960" height="55" fill="#eafbea" stroke="#2c6a2c"/>
  <text x="65" y="522" font-size="9" font-weight="bold" fill="#2c6a2c">Integrity guarantee</text>
  <text x="65" y="537" font-size="8.5">No partial row is left for Student B — the failed INSERT is rolled back entirely by the database transaction (AD-02, QS-04).</text>
  <text x="65" y="550" font-size="8.5">Exactly one Appointment row exists for slot S1 at all times; the database's UNIQUE constraint is the final arbiter, not application logic alone.</text>

  <rect x="55" y="570" width="960" height="70" fill="#eaf2ff" stroke="#2c4a7a"/>
  <text x="65" y="587" font-size="9" font-weight="bold" fill="#2c4a7a">Recovery / retry outcome</text>
  <text x="65" y="602" font-size="8.5">Student B is returned to the availability list (UC-07 Check Appointment Availability is re-invoked) to select a different, currently-open slot.</text>
  <text x="65" y="615" font-size="8.5">The client is NOT offered an automatic retry of the same slotId — this prevents an infinite retry loop against a slot that is now permanently taken,</text>
  <text x="65" y="628" font-size="8.5">and matches UC-06 exception 4a's defined behaviour ("system rejects, refreshes availability, asks student to reselect").</text>

  <!-- Test needed -->
  <rect x="55" y="650" width="960" height="80" fill="#fff8e8" stroke="#a67a1f"/>
  <text x="65" y="667" font-size="9" font-weight="bold" fill="#a67a1f">Test needed to verify this mechanism</text>
  <text x="65" y="682" font-size="8.5">Concurrency test: fire two bookAppointment requests for the same slotId from separate threads/clients with no artificial delay between them.</text>
  <text x="65" y="695" font-size="8.5">Assert: (1) exactly one HTTP 201 response is returned across both calls; (2) exactly one HTTP 409 SLOT_ALREADY_BOOKED is returned; (3) the</text>
  <text x="65" y="708" font-size="8.5">Appointment table contains exactly one row for that slot_id after both calls complete; (4) no Appointment row exists in a partial/invalid state.</text>
</svg>
