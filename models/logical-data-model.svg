<svg viewBox="0 0 1040 900" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="one" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto">
      <path d="M2,0 L2,10" stroke="#333" stroke-width="1.4"/>
    </marker>
  </defs>

  <text x="520" y="22" text-anchor="middle" font-size="16" font-weight="bold" fill="#7a1f2b">Logical Data Model — Student Registration Queue Management System</text>
  <text x="520" y="40" text-anchor="middle" font-size="11" fill="#555">Readable export of logical-data-model.mmd — derived from Phase 1 §6 Domain Model (multiplicities A-H)</text>

  <!-- STUDENT -->
  <rect x="30" y="70" width="230" height="130" fill="#eaf2ff" stroke="#333" stroke-width="1.3"/>
  <rect x="30" y="70" width="230" height="22" fill="#2c4a7a"/>
  <text x="145" y="86" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">STUDENT</text>
  <text x="40" y="106" font-size="9.5">PK student_id</text>
  <text x="40" y="120" font-size="9.5">name</text>
  <text x="40" y="134" font-size="9.5">UNIQUE email</text>
  <text x="40" y="148" font-size="9.5">password_hash</text>
  <text x="40" y="162" font-size="9.5">failed_login_count — QS-03</text>
  <text x="40" y="176" font-size="9.5">locked_until — QS-03</text>

  <!-- SERVICE_ADMINISTRATOR -->
  <rect x="780" y="70" width="230" height="70" fill="#eaf2ff" stroke="#333" stroke-width="1.3"/>
  <rect x="780" y="70" width="230" height="22" fill="#2c4a7a"/>
  <text x="895" y="86" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">SERVICE_ADMINISTRATOR</text>
  <text x="790" y="106" font-size="9.5">PK admin_id</text>
  <text x="790" y="120" font-size="9.5">name</text>

  <!-- REGISTRATION_SERVICE -->
  <rect x="405" y="70" width="230" height="100" fill="#eaf6ea" stroke="#333" stroke-width="1.3"/>
  <rect x="405" y="70" width="230" height="22" fill="#2c6a2c"/>
  <text x="520" y="86" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">REGISTRATION_SERVICE</text>
  <text x="415" y="106" font-size="9.5">PK service_id</text>
  <text x="415" y="120" font-size="9.5">UNIQUE name — UC-16 BR</text>
  <text x="415" y="134" font-size="9.5">FK admin_id</text>
  <text x="415" y="148" font-size="9.5">status: active | inactive</text>

  <!-- VIRTUAL_QUEUE -->
  <rect x="150" y="250" width="230" height="90" fill="#eaf6ea" stroke="#333" stroke-width="1.3"/>
  <rect x="150" y="250" width="230" height="22" fill="#2c6a2c"/>
  <text x="265" y="266" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">VIRTUAL_QUEUE</text>
  <text x="160" y="286" font-size="9.5">PK queue_id</text>
  <text x="160" y="300" font-size="9.5">FK service_id</text>
  <text x="160" y="314" font-size="9.5">status: open | closed</text>
  <text x="160" y="328" font-size="9.5">capacity — AF-01</text>

  <!-- APPOINTMENT_SLOT -->
  <rect x="640" y="250" width="230" height="110" fill="#eaf6ea" stroke="#333" stroke-width="1.3"/>
  <rect x="640" y="250" width="230" height="22" fill="#2c6a2c"/>
  <text x="755" y="266" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">APPOINTMENT_SLOT</text>
  <text x="650" y="286" font-size="9.5">PK slot_id</text>
  <text x="650" y="300" font-size="9.5">FK service_id</text>
  <text x="650" y="314" font-size="9.5">slot_date, start_time, end_time</text>
  <text x="650" y="328" font-size="9.5">capacity</text>
  <text x="650" y="342" font-size="9.5">slot_status: open | blocked</text>

  <!-- QUEUE_ENTRY -->
  <rect x="30" y="430" width="260" height="140" fill="#fff6e8" stroke="#333" stroke-width="1.3"/>
  <rect x="30" y="430" width="260" height="22" fill="#a67a1f"/>
  <text x="160" y="446" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">QUEUE_ENTRY</text>
  <text x="40" y="466" font-size="9.5">PK entry_id</text>
  <text x="40" y="480" font-size="9.5">FK queue_id, FK student_id</text>
  <text x="40" y="494" font-size="9.5">queue_number — UNIQUE per</text>
  <text x="40" y="506" font-size="9.5">  service/day (BR-06, UC-03)</text>
  <text x="40" y="520" font-size="9.5">status: Waiting|Called|Served|</text>
  <text x="40" y="532" font-size="9.5">  No-show|Cancelled</text>
  <text x="40" y="546" font-size="9.5">created_at — orders position</text>
  <text x="40" y="560" font-size="9.5">FK counter_id (nullable)</text>

  <!-- APPOINTMENT -->
  <rect x="600" y="430" width="260" height="140" fill="#fff6e8" stroke="#333" stroke-width="1.3"/>
  <rect x="600" y="430" width="260" height="22" fill="#a67a1f"/>
  <text x="730" y="446" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">APPOINTMENT</text>
  <text x="610" y="466" font-size="9.5">PK appointment_id</text>
  <text x="610" y="480" font-size="9.5">FK slot_id — UNIQUE (BR-02</text>
  <text x="610" y="492" font-size="9.5">  no double booking)</text>
  <text x="610" y="506" font-size="9.5">FK student_id</text>
  <text x="610" y="520" font-size="9.5">status: Booked|Called|Served|</text>
  <text x="610" y="532" font-size="9.5">  No-show|Cancelled</text>
  <text x="610" y="546" font-size="9.5">created_at</text>
  <text x="610" y="560" font-size="9.5">FK counter_id (nullable)</text>

  <!-- NOTIFICATION -->
  <rect x="330" y="620" width="260" height="90" fill="#f3eaff" stroke="#333" stroke-width="1.3"/>
  <rect x="330" y="620" width="260" height="22" fill="#6a2c7a"/>
  <text x="460" y="636" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">NOTIFICATION — UC-11</text>
  <text x="340" y="656" font-size="9.5">PK notification_id</text>
  <text x="340" y="670" font-size="9.5">FK student_id</text>
  <text x="340" y="684" font-size="9.5">event_type, channel</text>
  <text x="340" y="698" font-size="9.5">delivery_status: queued|sent|failed</text>

  <!-- Relationships with cardinality -->
  <!-- Student - QueueEntry (1 - 0..*) domain C -->
  <line x1="145" y1="200" x2="160" y2="430" stroke="#333" stroke-width="1.3"/>
  <text x="150" y="400" font-size="9">1</text>
  <text x="168" y="420" font-size="9">0..*</text>
  <text x="90" y="415" font-size="8.5" fill="#555">creates (domain C)</text>

  <!-- Student - Appointment (1 - 0..*) domain D -->
  <line x1="200" y1="200" x2="650" y2="430" stroke="#333" stroke-width="1.3"/>
  <text x="208" y="214" font-size="9">1</text>
  <text x="635" y="420" font-size="9">0..*</text>
  <text x="380" y="300" font-size="8.5" fill="#555">books (domain D)</text>

  <!-- Admin - RegistrationService (1 - 0..*) domain F -->
  <line x1="820" y1="140" x2="600" y2="140" stroke="#333" stroke-width="1.3"/>
  <text x="800" y="135" font-size="9">1</text>
  <text x="640" y="135" font-size="9">0..*</text>
  <text x="680" y="155" font-size="8.5" fill="#555">configures (domain F)</text>

  <!-- RegistrationService - VirtualQueue (1 - 0..*) domain E -->
  <line x1="470" y1="170" x2="265" y2="250" stroke="#333" stroke-width="1.3"/>
  <text x="440" y="195" font-size="9">1</text>
  <text x="300" y="240" font-size="9">0..*</text>
  <text x="330" y="210" font-size="8.5" fill="#555">has (domain E)</text>

  <!-- RegistrationService - AppointmentSlot (1 - 0..*) domain G -->
  <line x1="580" y1="170" x2="755" y2="250" stroke="#333" stroke-width="1.3"/>
  <text x="600" y="195" font-size="9">1</text>
  <text x="730" y="240" font-size="9">0..*</text>
  <text x="640" y="212" font-size="8.5" fill="#555">reserves (domain G)</text>

  <!-- VirtualQueue - QueueEntry (1 - 0..*) domain B -->
  <line x1="265" y1="340" x2="200" y2="430" stroke="#333" stroke-width="1.3"/>
  <text x="252" y="365" font-size="9">1</text>
  <text x="208" y="420" font-size="9">0..*</text>
  <text x="195" y="390" font-size="8.5" fill="#555">contains (domain B)</text>

  <!-- AppointmentSlot - Appointment (0..1 - 1) domain H -->
  <line x1="755" y1="360" x2="730" y2="430" stroke="#333" stroke-width="1.3"/>
  <text x="735" y="385" font-size="9">0..1</text>
  <text x="737" y="420" font-size="9">1</text>
  <text x="755" y="400" font-size="8.5" fill="#555">reserves (domain H)</text>

  <!-- Student - Notification (1 - 0..*) -->
  <line x1="145" y1="200" x2="400" y2="620" stroke="#333" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="150" y="420" font-size="9">1</text>
  <text x="395" y="610" font-size="9">0..*</text>
  <text x="200" y="500" font-size="8.5" fill="#555">receives (UC-11)</text>

  <!-- Legend / constraint note -->
  <rect x="30" y="760" width="980" height="110" fill="#f7f7f9" stroke="#999" stroke-dasharray="4 3"/>
  <text x="40" y="778" font-size="10" font-weight="bold" fill="#7a1f2b">Key constraints preserved from the domain model and business rules</text>
  <text x="40" y="794" font-size="9">• QUEUE_ENTRY: at most one row with status in (Waiting, Called) per (student_id, queue_id→service) — enforces BR-04 "one active entry per student per service."</text>
  <text x="40" y="808" font-size="9">• APPOINTMENT: slot_id is UNIQUE among active appointments — enforces BR-02 "no double booking" and BR-06 "unique queue position" equivalent for slots.</text>
  <text x="40" y="822" font-size="9">• APPOINTMENT: at most one active (Booked/Called) row per (student_id, service via slot) — enforces BR-04 "unique active appointment."</text>
  <text x="40" y="836" font-size="9">• QUEUE_ENTRY.queue_number is UNIQUE per (queue_id, calendar day) — enforces BR-06 and UC-03's daily reset rule.</text>
  <text x="40" y="850" font-size="9">• Consistency with domain model: no new entities added beyond Phase 1 §6; only persistence-level detail (keys, statuses, timestamps) layered on top. No differences to explain.</text>
</svg>
