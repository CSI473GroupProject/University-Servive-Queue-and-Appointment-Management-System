<svg viewBox="0 0 1180 700" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#7a1f2b"/>
    </marker>
  </defs>

  <text x="590" y="24" text-anchor="middle" font-size="16" font-weight="bold" fill="#7a1f2b">Navigation Model — Student and Registration Staff</text>
  <text x="590" y="42" text-anchor="middle" font-size="11" fill="#555">Readable export of navigation.mmd · screen ids (S1–S4, T1–T2) match prototype/wireframes-*.svg · edge labels = user action</text>

  <!-- Student lane -->
  <rect x="15" y="55" width="1150" height="340" fill="#eaf2ff" stroke="#2c4a7a"/>
  <text x="28" y="74" font-size="12" font-weight="bold" fill="#2c4a7a">Student (primary user) — mobile-first</text>

  <rect x="30" y="120" width="120" height="52" fill="#fff" stroke="#333"/>
  <text x="90" y="142" text-anchor="middle" font-size="11" font-weight="bold">Sign in</text>
  <text x="90" y="158" text-anchor="middle" font-size="9" fill="#555">UC-01</text>

  <rect x="30" y="250" width="120" height="58" fill="#fdecea" stroke="#7a1f2b"/>
  <text x="90" y="270" text-anchor="middle" font-size="10" font-weight="bold">Account locked</text>
  <text x="90" y="284" text-anchor="middle" font-size="9">message · QS-03</text>
  <text x="90" y="297" text-anchor="middle" font-size="9" fill="#555">(423 ACCOUNT_LOCKED)</text>

  <rect x="215" y="120" width="150" height="52" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="290" y="141" text-anchor="middle" font-size="11" font-weight="bold">S1 Services list</text>
  <text x="290" y="157" text-anchor="middle" font-size="9" fill="#555">UC-01 · FR-01</text>

  <rect x="470" y="85" width="160" height="52" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="550" y="106" text-anchor="middle" font-size="11" font-weight="bold">S2 Queue status</text>
  <text x="550" y="122" text-anchor="middle" font-size="9" fill="#555">UC-02, UC-04 · FR-02–04</text>

  <rect x="700" y="85" width="160" height="52" fill="#fff" stroke="#7a1f2b" stroke-dasharray="4 3"/>
  <text x="780" y="106" text-anchor="middle" font-size="10" font-weight="bold">Leave queue? dialog</text>
  <text x="780" y="122" text-anchor="middle" font-size="9" fill="#7a1f2b">no use case yet (gap)</text>

  <rect x="470" y="190" width="160" height="52" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="550" y="210" text-anchor="middle" font-size="11" font-weight="bold">S3 Choose time</text>
  <text x="550" y="226" text-anchor="middle" font-size="9" fill="#555">UC-06, UC-07 · FR-05, FR-06</text>

  <rect x="470" y="300" width="160" height="58" fill="#fdecea" stroke="#7a1f2b"/>
  <text x="550" y="320" text-anchor="middle" font-size="11" font-weight="bold">S4 Booking conflict</text>
  <text x="550" y="335" text-anchor="middle" font-size="9">S3 + error alert</text>
  <text x="550" y="348" text-anchor="middle" font-size="9" fill="#555">UC-06 exc. 4a · 409</text>

  <rect x="700" y="190" width="160" height="52" fill="#fff" stroke="#333"/>
  <text x="780" y="210" text-anchor="middle" font-size="11" font-weight="bold">Booking confirmed</text>
  <text x="780" y="226" text-anchor="middle" font-size="9" fill="#555">UC-06 step 5 · 201</text>

  <rect x="930" y="190" width="160" height="52" fill="#fff" stroke="#333"/>
  <text x="1010" y="210" text-anchor="middle" font-size="11" font-weight="bold">My appointments</text>
  <text x="1010" y="226" text-anchor="middle" font-size="9" fill="#555">UC-10</text>

  <rect x="930" y="300" width="160" height="52" fill="#fff" stroke="#333"/>
  <text x="1010" y="320" text-anchor="middle" font-size="10" font-weight="bold">Cancel appointment dialog</text>
  <text x="1010" y="336" text-anchor="middle" font-size="9" fill="#555">UC-08, UC-09 · FR-08</text>

  <rect x="930" y="85" width="200" height="52" fill="#fff8e8" stroke="#a67a1f"/>
  <text x="1030" y="106" text-anchor="middle" font-size="10" font-weight="bold">Notifications panel</text>
  <text x="1030" y="122" text-anchor="middle" font-size="9" fill="#555">UC-11 · reachable from any screen</text>

  <!-- student edges -->
  <line x1="150" y1="146" x2="215" y2="146" stroke="#333" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="152" y="138" font-size="8.5" fill="#555">success</text>
  <line x1="90" y1="172" x2="90" y2="250" stroke="#7a1f2b" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#ar)"/>
  <text x="96" y="215" font-size="8.5" fill="#7a1f2b">5 failed attempts</text>

  <line x1="365" y1="135" x2="470" y2="112" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
  <text x="372" y="110" font-size="9" font-weight="bold">Join queue (1 action)</text>
  <line x1="365" y1="160" x2="470" y2="212" stroke="#333" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="372" y="198" font-size="9">Book appointment</text>

  <line x1="630" y1="111" x2="700" y2="111" stroke="#333" stroke-width="1.2" marker-end="url(#a)"/>
  <text x="634" y="104" font-size="8.5" fill="#555">Leave queue</text>
  <path d="M780,85 V62 H290 V120" fill="none" stroke="#333" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#a)"/>
  <text x="520" y="59" font-size="8.5" fill="#555">Confirm / Keep my place</text>

  <line x1="630" y1="216" x2="700" y2="216" stroke="#333" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="632" y="209" font-size="8.5" fill="#555">Confirm booking</text>
  <line x1="860" y1="216" x2="930" y2="216" stroke="#333" stroke-width="1.2" marker-end="url(#a)"/>
  <line x1="530" y1="242" x2="530" y2="300" stroke="#7a1f2b" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#ar)"/>
  <text x="440" y="270" font-size="8.5" fill="#7a1f2b">slot taken (409)</text>
  <line x1="570" y1="300" x2="570" y2="242" stroke="#333" stroke-width="1.3" marker-end="url(#a)"/>
  <text x="576" y="274" font-size="8.5" fill="#555">choose another time</text>
  <line x1="1010" y1="242" x2="1010" y2="300" stroke="#333" stroke-width="1.2" marker-end="url(#a)"/>
  <text x="1016" y="275" font-size="8.5" fill="#555">Cancel</text>
  <path d="M365,160 V380 H1150 V216 H1090" fill="none" stroke="#999" stroke-width="1" stroke-dasharray="2 3" marker-end="url(#a)"/>
  <text x="700" y="376" font-size="8.5" fill="#777">"My appointments" in the main navigation</text>

  <!-- Staff lane -->
  <rect x="15" y="410" width="1150" height="205" fill="#eafbea" stroke="#2c6a2c"/>
  <text x="28" y="429" font-size="12" font-weight="bold" fill="#2c6a2c">Registration Staff (secondary user) — desktop</text>

  <rect x="30" y="480" width="120" height="52" fill="#fff" stroke="#333"/>
  <text x="90" y="510" text-anchor="middle" font-size="11" font-weight="bold">Sign in</text>

  <rect x="215" y="470" width="190" height="62" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="310" y="492" text-anchor="middle" font-size="11" font-weight="bold">T1 Queue dashboard (home)</text>
  <text x="310" y="508" text-anchor="middle" font-size="9" fill="#555">UC-12 · FR-09</text>
  <text x="310" y="522" text-anchor="middle" font-size="9" fill="#555">Call next sits on this screen</text>

  <rect x="500" y="455" width="200" height="62" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="600" y="477" text-anchor="middle" font-size="11" font-weight="bold">T1 Called-student panel</text>
  <text x="600" y="493" text-anchor="middle" font-size="9" fill="#555">Complete / No-show · UC-14, UC-15</text>
  <text x="600" y="507" text-anchor="middle" font-size="9" fill="#555">FR-10</text>

  <rect x="500" y="545" width="200" height="52" fill="#fdecea" stroke="#7a1f2b"/>
  <text x="600" y="567" text-anchor="middle" font-size="10" font-weight="bold">T2 Empty / stale states</text>
  <text x="600" y="583" text-anchor="middle" font-size="9" fill="#555">UC-14 exc. 1a · connection lost</text>

  <rect x="790" y="500" width="190" height="52" fill="#fff" stroke="#333"/>
  <text x="885" y="522" text-anchor="middle" font-size="11" font-weight="bold">Appointments view</text>
  <text x="885" y="538" text-anchor="middle" font-size="9" fill="#555">UC-13</text>

  <line x1="150" y1="506" x2="215" y2="506" stroke="#333" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="405" y1="490" x2="500" y2="486" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
  <text x="405" y="478" font-size="9" font-weight="bold">Call next (1 action)</text>
  <path d="M600,517 V528 H330 V532" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#a)"/>
  <text x="430" y="541" font-size="9">Complete / No-show (1 action)</text>
  <line x1="380" y1="532" x2="500" y2="565" stroke="#7a1f2b" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#ar)"/>
  <text x="300" y="560" font-size="8.5" fill="#7a1f2b">no one waiting or due</text>
  <line x1="405" y1="515" x2="790" y2="522" stroke="#333" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#a)"/>
  <text x="745" y="505" font-size="8.5" fill="#555">Appointments</text>

  <!-- Shortest paths -->
  <rect x="15" y="625" width="1150" height="62" fill="#fff" stroke="#333"/>
  <text x="28" y="642" font-size="10" font-weight="bold">Shortest reasonable paths (user actions after sign-in)</text>
  <text x="28" y="657" font-size="9">Task A join queue: 1 action (Join queue) → S2.   Task B book appointment: 3 actions (Book appointment → choose time → Confirm booking), +1 if another date is needed.</text>
  <text x="28" y="671" font-size="9">Task C staff: 2 actions per student (Call next → Complete or No-show), no navigation between cycles. Thick arrows mark each critical path. QS-05 clock starts on the S1 Services list.</text>
</svg>
